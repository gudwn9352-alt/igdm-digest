# igdm-digest 설정 파일
# 이 파일을 config.yaml 로 복사한 뒤 내용을 채우세요. (config.yaml 은 git 에 올라가지 않습니다)

instagram:
  # 인스타그램 표시 이름(내보내기 파일의 participants 에 나오는 내 이름).
  # 비워두면 "모든 대화방에 공통으로 등장하는 참가자"를 나로 자동 감지합니다.
  my_name: ""
  # 메시지 요청함(message_requests) 도 포함할지
  include_message_requests: true
  timezone: Asia/Seoul

analysis:
  model: claude-opus-5-5
  effort: high              # low | medium | high | xhigh | max
  fetch_links: true         # DM 안의 링크(노션, 블로그 등) 본문을 가져와 함께 분석
  max_link_chars: 6000      # 링크 1개당 분석에 넣을 최대 글자 수
  min_usefulness_to_report: 40   # 이 점수 미만은 리포트에서 "제외됨" 으로만 집계
  # Claude 안전 분류기가 요청을 거절할 때 서버가 자동으로 다른 모델로 재시도 (권장)
  server_side_fallbacks: true

business:
  owner: "홍길동"
  summary: >
    온라인으로 수익을 낼 수 있는 일은 모두 합니다. 현재 쇼핑몰을 운영 중이지만 매출은 0 입니다.
    해외 타깃 Shopify 스토어도 열 수 있고, 릴스 영상을 직접 만들어 수익화하는 것,
    펜션 등 소상공인 홈페이지 제작 대행, Higgsfield 를 활용한 홍보 영상 제작 판매까지 모두 검토합니다.
  goals:
    this_week: "7일 안에 100만원 수입 만들기 (매출이 아니라 실제로 들어오는 돈 기준)"
    ongoing: "수입을 계속 늘려 안정적인 온라인 수익 구조 만들기"
  lines:
    - name: "쇼핑몰 (국내 + 해외 타깃 Shopify)"
      status: "국내몰 운영 중, 매출 0. 해외 Shopify 는 검토 중"
      notes: "유입·전환을 만들 방법, 팔릴 상품·시장 선정이 필요함"
    - name: "릴스 영상 제작·수익화"
      status: "시작 단계"
      notes: "직접 릴스를 만들어 수익화(광고·제휴·서비스 유입) 하거나, 업체용 릴스 제작을 판매"
    - name: "소상공인 홈페이지 제작 대행"
      status: "시작 단계"
      notes: "펜션, 식당 등 홈페이지가 없거나 낡은 업체가 타깃. 빠르게 현금화 가능한 서비스"
    - name: "AI 홍보 영상 제작 (Higgsfield)"
      status: "시작 단계"
      notes: "짧은 홍보 영상을 빠르게 제작해 업체에 판매"
    - name: "기타 온라인 수익 모델"
      status: "탐색 중"
      notes: "제휴 마케팅, 디지털 상품, 자동화 서비스 등 무엇이든 검토"
  constraints: "1인 운영, 초기 비용 최소화, 이번 주 현금화 가능한 것 우선"

delivery:
  method: gmail             # gmail | file | stdout   (나중에 바꾸려면 이 값만 변경)
  subject_prefix: "[IG DM 다이제스트]"
  gmail:
    to: "me@gmail.com"
    from: "me@gmail.com"
    # 앱 비밀번호는 파일에 쓰지 말고 환경변수에 넣으세요: export GMAIL_APP_PASSWORD="xxxx xxxx xxxx xxxx"
    app_password_env: GMAIL_APP_PASSWORD
    smtp_host: smtp.gmail.com
    smtp_port: 587
  file:
    dir: data/reports

actions:
  # 승인 없이 자동 실행할 액션 유형. 외부로 나가는 것(메일 발송)은 절대 자동 실행되지 않습니다.
  # 가능한 값: checklist, content_brief, experiment, research, lead_search, outreach_draft
  auto_execute: []
  outreach_from_name: "홍길동"
  outreach_signature: |
    홍길동 드림
    (연락처 / 포트폴리오 링크)

paths:
  data_dir: data
